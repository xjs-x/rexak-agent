[project]
name = "agent-workbench"
version = "0.1.0"
description = "Web/API 自主黑盒测试工作台 —— 控制端（API + Runner）"
readme = "README.md"
# 控制端开发与运行基线是 3.12（.python-version 与 uv.lock 均按 3.12 解析）。
# 上限放宽到 <3.14 的唯一原因：执行岛（Kali rolling）只有 Python 3.13，
# 且岛上无法访问 GitHub 安装独立的 3.12 解释器。详见 docs/decisions/0002-executor-python-baseline.md。
requires-python = ">=3.12,<3.14"

dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.27.2",
    "asyncssh>=2.18.0",
    "structlog>=24.4.0",
    "typer>=0.15.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0,<7",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "pillow>=12,<13",
    "psutil>=7,<8",
    "pefile>=2024.8.26,<2027",
    "pyelftools>=0.32,<1",
    "capstone>=5,<6",
]

[project.scripts]
workbench = "agent_workbench.cli:main"

# TSecBench 评测接入是**独立、按需启动**的外部入口：
# 不装这个 extra 时，API / Runner / 前端 / 执行岛完全不依赖它。
# 使用：uv run --extra benchmark workbench tsec ...
[project.optional-dependencies]
benchmark = [
    "tsec-benchmark>=0.1.2,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "aiosqlite>=0.20.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["executor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "E501",
    # 本项目文档、注释与用户可见文案使用中文全角标点（，。：（）——“”），
    # RUF001/002/003 会把它们判为 "ambiguous unicode"。这是有意为之的排版约定，
    # 不是编码事故；真正的编码问题由 scripts/check_encoding.py 与 tests/unit/test_encoding.py 把关。
    "RUF001",
    "RUF002",
    "RUF003",
    # 异常类命名沿用领域术语（ArtifactError / PolicyDenied 等），不强制 Error 后缀
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
"scripts/**" = ["T201"]
# fixture 目标需要保持 BaseHTTPRequestHandler 的基类签名，参数未使用是刻意的
"evals/fixtures/**" = ["ARG002"]
# SQLAlchemy 的 PostgreSQL UUID 方言类型以 PgUUID 别名引入是社区通行写法，
# 与 PostgreSQL 内置的 UUID 类型区分。N811 在此为误报。
"src/agent_workbench/persistence/tables.py" = ["N811"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pyright]
include = ["src", "executor/src", "tests", "scripts", "evals"]
# 让测试能直接 import scripts/ 下的检查脚本（例如 check_encoding）
extraPaths = ["scripts"]
exclude = ["web", "migrations/versions"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
# 让 `uv run pytest`（console script，不会把 CWD 放进 sys.path）也能解析 `tests` 包。
# 只有 `python -m pytest` 能过不算数：验收命令就是 `uv run pytest`。
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: 需要真实 PostgreSQL 的测试",
    "real_model: 需要真实模型凭据的测试（无凭据时标记 NOT_RUN）",
    "real_executor: 需要真实执行岛的测试",
    "recovery: 故障注入与恢复测试",
]
addopts = "-ra --strict-markers"
