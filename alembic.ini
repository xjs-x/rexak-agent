# Alembic configuration.
#
# NOTE: this file must stay ASCII-only.
# Alembic reads it with `encoding="locale"`, and on a GBK-locale Windows host
# any non-ASCII byte here raises UnicodeDecodeError before the app can start.
# Keep all comments in English/ASCII inside this file; put explanations in docs/.
#
# Scope: Alembic manages the business schema (app) only.
# Framework tables (agent_checkpoint / agent_memory) are created by
# `workbench db-init` via the framework setup() call.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
