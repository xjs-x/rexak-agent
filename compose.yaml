# ============================================================
# Agent Workbench 本地基础设施
#
# 重要：默认 compose 重建应用**不删除**数据库与工件卷。
#      禁止把 `docker compose down -v` 当作日常启动步骤。
#      清理数据卷是显式的破坏性操作，需人工确认。
# ============================================================

name: agent-workbench

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
      # 统一 UTC 存储；UI 按 Asia/Shanghai 显示
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - workbench-pgdata:/var/lib/postgresql/data
      # 迁移与初始化由 `workbench db-init` / Alembic 执行，不用 docker-entrypoint-initdb.d，
      # 避免"只在首次启动生效"的隐式行为。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  workbench-pgdata:
    name: workbench-pgdata
